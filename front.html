<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Login</title>

    <link rel="stylesheet" href="front.css">
</head>
<body>

<div class="container">


    <div class="left">
        
<title>

        <h1>Bem-vindo!</h1>

        <p>
           Escola Estadual Monsenhor horta
        </p>
        </title>
    </div>

    <div class="right">

        <div class="login-box">

            <h2>Área de Login</h2>

            <p>Faça login para continuar</p>

            <form>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="options">

                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>

                    <a href="#">Esqueci minha senha</a>

                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

            </form>

            <div class="separator">
                ou continue com
            </div>

            <div class="social">

                <button class="google">
                    Google
                </button>

              

            </div>

            <div class="register">
                Não possui conta?
                <a href="#">Criar conta</a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
